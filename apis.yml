name: Skyboximaging
description: 'Skybox Imaging was a satellite imaging and geospatial-analytics company (founded 2009, Mountain
  View, CA) that built a constellation of small high-resolution Earth-observation satellites (SkySat) and
  the analytics to turn frequent imagery into commercial insight. Backed by Norwest Venture Partners, Bessemer,
  Khosla Ventures and others, it was acquired by Google in 2014 (~$500M), renamed Terra Bella, and its satellite
  business was sold to Planet Labs in 2017. The skyboximaging.com domain is no longer a live product surface;
  this profile is retained in the API Evangelist network for portfolio-graph and historical reference.'
